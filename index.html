<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coachifyy · Complete Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://x.klarnacdn.net/kp/lib/v1/api.js"></script>
  <style>
    :root {
      --bg-page: #f9fafb;
      --bg-card: #ffffff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-card: 0 1px 3px rgba(17, 24, 39, 0.06), 0 8px 24px rgba(17, 24, 39, 0.06);
      --primary: #7c3aed;
      --secondary: #2563eb;
      --gradient: linear-gradient(90deg,
          #25148c 0%,
          #4b3dda 40%,
          #7a56f5 75%,
          #b45af7 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    .top-bar-title {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .top-bar-title img {
      height: 40px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.15s, border-color 0.15s;
    }

    .icon-btn:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .content {
      padding: 2rem;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }

    .greeting {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .greeting h2 {
      margin: 0 0 0.375rem;
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .greeting p {
      margin: 0;
      font-size: 0.9375rem;
      color: var(--text-secondary);
      max-width: 420px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Klarna widget must stay in DOM with layout; do not use pointer-events: none */
    #klarna-container {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(229, 231, 235, 0.8);
      overflow: hidden;
    }

    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-header h3 {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-body {
      padding: 1.5rem;
    }

    .product-row {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .product-thumb {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(37, 99, 235, 0.12));
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .product-thumb.placeholder {
      display: grid;
      place-items: center;
      color: var(--primary);
    }

    .product-thumb.placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.7;
    }

    .product-info h4 {
      margin: 0 0 0.35rem;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .product-info p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .badge-pay {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(124, 58, 237, 0.1);
      color: var(--primary);
    }

    .pay-actions {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .pay-with-klarna {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.875rem;
    }

    .pay-with-klarna .pay-with-text {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .pay-with-klarna .klarna-logo-img {
      height: 24px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .btn-pay {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.875rem 1.25rem;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s, opacity 0.15s;
    }

    .btn-pay:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #6d28d9;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
    }

    .btn-pay:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      font-size: 0.875rem;
    }

    .alert-error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    @media (max-width: 600px) {
      .top-bar {
        padding: 1rem 1.25rem;
      }

      .content {
        padding: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top-bar">
      <div class="top-bar-title">
        <img
          src="https://firebasestorage.googleapis.com/v0/b/coachifyy-2026.firebasestorage.app/o/app_text_logo.png?alt=media&token=92f354d1-c6ec-4f06-a3bf-5580b67e95a6"
          alt="Coachifyy" />
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" aria-label="Help" title="Help">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div class="greeting">
        <div>
          <h2 id="greeting-title">Complete your purchase</h2>
          <p>Review your order and pay securely with Klarna. Your coach thanks you for your trust.</p>
        </div>
      </div>

      <div id="token-warning" class="alert" style="display: none; margin-bottom: 1.25rem"></div>
      <div id="klarna-error" class="alert alert-error" style="display: none; margin-bottom: 1.25rem"></div>

      <div class="cards">
        <section class="card" aria-labelledby="order-heading">
          <div class="card-header">
            <h3 id="order-heading">Order summary</h3>
          </div>
          <div class="card-body">
            <div class="product-row">
              <img id="product-image" class="product-thumb" alt="" hidden />
              <div id="product-placeholder" class="product-thumb placeholder" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
              </div>
              <div class="product-info">
                <h4 id="product-name">Your order</h4>
                <p id="product-sub">Tap Pay now to complete checkout with Klarna.</p>
                <span class="badge-pay">Klarna · Pay over time</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="pay-actions">
        <div class="pay-with-klarna">
          <span class="pay-with-text">Pay with</span>
          <img class="klarna-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Klarna_Logo_black.svg"
            alt="Klarna" width="108" height="24" />
        </div>
        <button type="button" class="btn-pay" id="pay-btn" disabled>Pay now</button>
      </div>

      <div id="klarna-container" aria-hidden="true"></div>
    </main>
  </div>

  <script>
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      const orderID =
        params.get("orderID") ||
        params.get("orderId") ||
        params.get("order") ||
        "";
      return {
        token: params.get("token"),
        orderID: orderID.trim(),
        productName:
          params.get("productName") ||
          params.get("product") ||
          "Your order",
        productImage:
          params.get("productImage") ||
          params.get("image") ||
          "",
        category:
          params.get("category") ||
          params.get("payment_method_category") ||
          "pay_over_time",
      };
    }

    const {
      token: clientToken,
      orderID,
      productName,
      productImage,
      category: paymentMethodCategory,
    } = getQueryParams();

    const productNameEl = document.getElementById("product-name");
    const productImgEl = document.getElementById("product-image");
    const productPlaceholder = document.getElementById("product-placeholder");
    const tokenWarning = document.getElementById("token-warning");
    const klarnaError = document.getElementById("klarna-error");
    const payBtn = document.getElementById("pay-btn");

    let klarnaReady = false;

    productNameEl.textContent = productName;

    if (productImage && productImage.trim()) {
      productImgEl.src = productImage.trim();
      productImgEl.alt = productName;
      productImgEl.hidden = false;
      productPlaceholder.hidden = true;
      productImgEl.onerror = function () {
        productImgEl.hidden = true;
        productPlaceholder.hidden = false;
      };
    }

    function showKlarnaError(message) {
      klarnaError.style.display = "block";
      klarnaError.textContent = message;
      payBtn.disabled = true;
      klarnaReady = false;
    }

    function initKlarna() {
      if (!clientToken || !orderID) {
        tokenWarning.style.display = "block";
        const parts = [];
        if (!clientToken) {
          parts.push("add a ?token=… query parameter for the Klarna session");
        }
        if (!orderID) {
          parts.push("add an ?orderID=… query parameter for your order");
        }
        tokenWarning.textContent = "Cannot checkout: " + parts.join(" and ") + ".";
        payBtn.disabled = true;
        return;
      }

      if (typeof Klarna === "undefined" || !Klarna.Payments) {
        showKlarnaError("Klarna SDK failed to load. Check your network or ad blocker.");
        return;
      }

      try {
        Klarna.Payments.init({
          client_token: clientToken,
        });
      } catch (err) {
        showKlarnaError("Could not initialize Klarna: " + (err.message || err));
        return;
      }

      Klarna.Payments.load(
        {
          container: "#klarna-container",
          payment_method_category: paymentMethodCategory,
        },
        function (loadRes) {
          console.log("[Klarna] load", loadRes);

          if (loadRes && loadRes.error) {
            showKlarnaError(
              "Klarna could not load this payment method (" +
                paymentMethodCategory +
                "). Try again or contact support."
            );
            return;
          }

          if (loadRes && loadRes.show_form === false) {
            showKlarnaError(
              "This order is not eligible for " +
                paymentMethodCategory +
                ". Check your Klarna merchant settings."
            );
            return;
          }

          klarnaReady = true;
          payBtn.disabled = false;
        }
      );
    }

    function pay() {
      if (!clientToken || !orderID || !klarnaReady) {
        return;
      }

      payBtn.disabled = true;

      Klarna.Payments.authorize(
        {
          payment_method_category: paymentMethodCategory,
        },
        {},
        function (res) {
          console.log("[Klarna] authorize", res);
          payBtn.disabled = false;

          if (res && res.approved && res.authorization_token) {
            window.location.href =
              "https://seller.coachifyy.de/order=" +
              encodeURIComponent(orderID) +
              "&auth=" +
              encodeURIComponent(res.authorization_token);
            return;
          }

          if (res && res.show_form === false) {
            showKlarnaError("Payment could not be completed. Please try again.");
            return;
          }

          if (res && res.error) {
            showKlarnaError("Payment error: " + (res.error.invalid_fields || res.error.message || "unknown"));
            return;
          }

          // User closed the popup or cancelled — no alert needed
        }
      );
    }

    payBtn.addEventListener("click", pay);

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initKlarna);
    } else {
      initKlarna();
    }
  </script>
</body>

</html>
